name: CCGateway images

# Builds the Claude Code runtime images (business container, shared Xray
# egress gateway, account controller) and the ccgateway guard.
#
# Since CONTRACTS §53.10 the images ship INSIDE the ccgateway plugin package:
# the release host runs next/deploy/docker/build-ccgateway-images.sh before
# building the core (prepare-core-release.sh, REQUIRE_CCGATEWAY_IMAGES=1) and
# the core installs / pushes the bundled archives itself. The `bundle` job
# below runs that very script on a GitHub runner and packs ccgateway with its
# images, so the release path is exercised on every change. The GHCR push
# (`images`) is kept for anyone pulling the images directly (the GHCR
# packages are private).
#
# The guard (CONTRACTS §76) is NOT in the plugin package: its GHCR digest
# (the `images` summary of ccgateway-guard) is pinned as GuardImage in
# next/server/internal/ccgateway/images.go. The controller is the Go
# controller (companions/controller-go); the Python controller of ccgateway
# 0.1.118 and earlier was removed on 2026-11-01.

on:
  push:
    branches: [main, feat/next-platform]
    paths:
      - 'next/plugins/ccgateway/companions/**'
      - 'next/plugins/ccgateway/manifest.json'
      - 'next/deploy/docker/build-ccgateway-images.sh'
      - 'next/tools/sub2api-plugin/**'
      - '.github/workflows/ccgateway-images.yml'
  # Pull requests run the tests only; images are built and published on push.
  pull_request:
    paths:
      - 'next/plugins/ccgateway/companions/**'
      - 'next/plugins/ccgateway/manifest.json'
      - 'next/deploy/docker/build-ccgateway-images.sh'
      - 'next/tools/sub2api-plugin/**'
      - '.github/workflows/ccgateway-images.yml'
  workflow_dispatch:

concurrency:
  group: ccgateway-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: next/go.work
      - name: ccgateway (Go)
        working-directory: next/plugins/ccgateway/companions
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: account Worker (Go)
        working-directory: next/plugins/ccgateway/companions/worker
        run: |
          go vet ./...
          go test ./...
      # Shared vocabulary and the cross-layer contract fixtures (testdata/).
      - name: contracts (Go)
        run: sh .github/next-ci/next-check-module.sh next/plugins/ccgateway/companions/contracts
      # The Go controller and the guard are modules of their own: the
      # companions module's go vet / go test above do not enter them (its
      # gofmt -l does). Until a module lands the step is a no-op.
      - name: controller (Go)
        if: hashFiles('next/plugins/ccgateway/companions/controller-go/go.mod') != ''
        working-directory: next/plugins/ccgateway/companions/controller-go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=linux go vet ./...
          go test -count=1 -race ./...
      - name: guard (Go)
        if: hashFiles('next/plugins/ccgateway/companions/guard/go.mod') != ''
        working-directory: next/plugins/ccgateway/companions/guard
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=linux go vet ./...
          go test -count=1 -race ./...
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # The CLI support modules, including the Worker → CLI contract fixture.
      # patch-wire-preservation-304 patches the recovered CLI, which is not in
      # Git; it runs where that source is (tests needing it otherwise skip,
      # visibly).
      - name: CLI mods
        working-directory: next/plugins/ccgateway/companions/cli-mods
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --test $(ls test/*.test.mjs | grep -v patch-wire-preservation-304)

  # The release path of §53.10: build-ccgateway-images.sh on a Docker host,
  # then `sub2api-plugin pack --images` exactly as deploy/docker/build-go.sh
  # does with REQUIRE_CCGATEWAY_IMAGES=1. Nothing is published.
  bundle:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: next/go.work
          check-latest: false
          cache: true
          cache-dependency-path: |
            next/go.work.sum
            next/**/go.sum
      - name: Build the runtime images (build-ccgateway-images.sh)
        working-directory: next
        run: |
          version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugins/ccgateway/manifest.json | head -n1)
          dash deploy/docker/build-ccgateway-images.sh "$version" plugins/ccgateway/images
      - name: Pack ccgateway with the bundled images
        working-directory: next
        run: |
          cli="$RUNNER_TEMP/sub2api-plugin"
          (cd tools/sub2api-plugin && go build -o "$cli" .)
          "$cli" build --dir plugins/ccgateway --out "$RUNNER_TEMP/ccgateway-runtimes"
          pkg=$("$cli" pack --dir plugins/ccgateway --runtimes "$RUNNER_TEMP/ccgateway-runtimes" \
            --images plugins/ccgateway/images --image-roles app,egress,controller,gateway --out-dir "$RUNNER_TEMP/market")
          ls -l "$pkg"
          unzip -v "$pkg" | tee "$RUNNER_TEMP/entries.txt"
          for role in app egress controller gateway; do
            grep -Eq " Stored .* images/$role\.tar\.gz$" "$RUNNER_TEMP/entries.txt" || { echo "::error::images/$role.tar.gz missing or compressed"; exit 1; }
          done
          # Exactly the four roles (the guard is never packed), and the
          # controller is the Go controller that runs under the guard.
          roles=$(grep -Eo '^    "[a-z]+": \{' plugins/ccgateway/images/images.json | tr -d ' ":{' | sort | tr '\n' ,)
          [ "$roles" = app,controller,egress,gateway, ] || { echo "::error::images.json roles: $roles"; exit 1; }
          grep -Eq '^    "controller": \{.*"labels": \{"io\.sup2api\.ccgateway\.guard-api": "1"\}' plugins/ccgateway/images/images.json \
            || { echo '::error::the bundled controller does not declare io.sup2api.ccgateway.guard-api=1'; exit 1; }
          [ "$(docker image inspect --format '{{index .Config.Labels "io.sup2api.ccgateway.guard-api"}}' "ccgateway-controller:$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugins/ccgateway/manifest.json | head -n1)")" = 1 ] \
            || { echo '::error::the controller image lacks io.sup2api.ccgateway.guard-api=1'; exit 1; }
          {
            echo '### ccgateway package with bundled images'
            echo '```'
            ls -l "$pkg"
            cat plugins/ccgateway/images/images.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ccgateway-app
            context: next/plugins/ccgateway/companions
            file: next/plugins/ccgateway/companions/worker/Dockerfile
          - name: ccgateway-egress
            context: next/plugins/ccgateway/companions/xray-egress
            file: next/plugins/ccgateway/companions/xray-egress/Dockerfile
          - name: ccgateway-controller
            context: next/plugins/ccgateway/companions/controller-go
            file: next/plugins/ccgateway/companions/controller-go/Dockerfile
          # Not in the plugin package: its digest is GuardImage in the core.
          - name: ccgateway-guard
            context: next/plugins/ccgateway/companions/guard
            file: next/plugins/ccgateway/companions/guard/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}
      - name: Digest
        run: |
          echo "${{ matrix.name }}: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
