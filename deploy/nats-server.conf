# Single-node JetStream server for AI Gateway settlement delivery.

server_name: sup2api-nats
port: 4222
http: 8222

# Bound per-client memory while allowing enough headroom for bursty settlement
# traffic. Values are supplied by Compose so operators can tune without
# rebuilding the image.
max_connections: $NATS_MAX_CONNECTIONS
max_payload: $NATS_MAX_PAYLOAD
max_pending: $NATS_MAX_PENDING
write_deadline: "10s"
ping_interval: "2m"
ping_max: 3

jetstream {
  # NATS appends its own `jetstream` directory. Keeping the root at /data is
  # compatible with the existing `--store_dir /data` deployment.
  store_dir: "/data"
  max_memory_store: $NATS_JETSTREAM_MAX_MEMORY_STORE
  max_file_store: $NATS_JETSTREAM_MAX_FILE_STORE
  sync_interval: $NATS_JETSTREAM_SYNC_INTERVAL
}

# Generated by setup_nats_nsc.sh. It contains only signed public Operator and
# Account JWTs; private signing seeds are never mounted into the NATS server.
include "nats-server-auth.conf"
