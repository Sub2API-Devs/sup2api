# Standalone: docker compose --env-file .env.ccgateway -f docker-compose.ccgateway.yml up -d --build
services:
  ccgateway:
    build: ../tools/ccgateway
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${CCG_PORT:-8787}:8787"
    environment:
      CCG_API_KEY: ${CCG_API_KEY:?Set a gateway API key}
      CCG_ADMIN_KEY: ${CCG_ADMIN_KEY:?Set a separate management key}
    volumes:
      - ccgateway-data:/work
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  ccgateway-data:
