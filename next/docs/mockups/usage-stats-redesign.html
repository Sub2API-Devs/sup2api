<style>
:root{

  --bg:#f8fafc;--surface:#ffffff;--surface-2:#f8fafc;--line:#e2e8f0;--line-soft:#f1f5f9;
  --fg:#0f172a;--fg-muted:#64748b;--fg-subtle:#94a3b8;

  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--other:#94a3b8;

  color-scheme:dark;

  --fg:#e2e8f0;--fg-muted:#94a3b8;--fg-subtle:#64748b;
  --primary:#2dd4bf;--primary-600:#14b8a6;--primary-50:rgba(20,184,166,.12);--primary-700:#5eead4;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--other:#64748b;

  --tint-primary:rgba(20,184,166,.15);--tint-info:rgba(14,165,233,.15);--tint-success:rgba(16,185,129,.15);--tint-warning:rgba(245,158,11,.15);--tint-danger:rgba(239,68,68,.15);--tint-accent:rgba(139,92,246,.15);

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit}
.mockbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#0f172a;color:#e2e8f0;font-size:13px}
.mockbar b{margin-right:8px}
.mockbar button{border:1px solid #334155;background:#1e293b;border-radius:8px;padding:4px 10px;cursor:pointer}
.mockbar button.on{background:#14b8a6;border-color:#14b8a6;color:#042f2e}
.mockbar .sp{flex:1}
.mockbar .note{color:#94a3b8}
.app{display:flex;min-height:calc(100vh - 44px)}
.side{width:240px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#0891b2);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;box-shadow:0 0 18px rgba(20,184,166,.35)}
.logo span{font-weight:700}.logo small{font-size:11px;color:var(--fg-subtle);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.sect{font-size:11px;color:var(--fg-subtle);padding:12px 12px 4px;letter-spacing:.04em}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--fg-muted);font-weight:500;cursor:default}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--primary-50);color:var(--primary-700)}
.nav svg{width:18px;height:18px;flex:none}
.nav .tag{margin-left:auto;font-size:10px;border:1px dashed var(--fg-subtle);border-radius:6px;padding:0 4px;color:var(--fg-subtle)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(12px)}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--fg-muted);background:var(--surface)}
.pill b{color:var(--fg)}
.avatar{width:30px;height:30px;border-radius:50%;background:#6366f1;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.content{padding:24px 32px 48px;max-width:1600px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;gap:12px}
.ph h1{margin:0;font-size:22px}.ph p{margin:2px 0 0;color:var(--fg-muted);font-size:13px}
.ph .acts{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn.pri{background:linear-gradient(135deg,#14b8a6,#0d9488);border-color:transparent;color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card.pad{padding:16px}
.ch{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.ch h3{margin:0;font-size:14px;font-weight:600}.ch .sub{color:var(--fg-subtle);font-size:12px}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.stat{display:flex;gap:12px;align-items:center;padding:16px}
.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat .ic svg{width:22px;height:22px}
.t-primary{background:var(--tint-primary);color:var(--ink-primary)}.t-info{background:var(--tint-info);color:var(--ink-info)}
.t-success{background:var(--tint-success);color:var(--ink-success)}.t-warning{background:var(--tint-warning);color:var(--ink-warning)}
.t-danger{background:var(--tint-danger);color:var(--ink-danger)}.t-accent{background:var(--tint-accent);color:var(--ink-accent)}
.stat .lb{font-size:12px;color:var(--fg-muted)}
.stat .v{font-size:22px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:500;color:var(--fg-subtle)}
.stat .s{font-size:12px;color:var(--fg-subtle)}
.stat .s b{font-weight:500;color:var(--fg-muted)}
.up{color:var(--ok)}.down{color:var(--bad)}
.strike{text-decoration:line-through}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px}
.fld{display:flex;flex-direction:column;gap:2px}
.fld label{font-size:11px;color:var(--fg-subtle)}
.sel{border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:120px;background:var(--surface);display:flex;align-items:center;gap:6px;font-size:13px}
.sel svg{width:14px;height:14px;color:var(--fg-subtle)}
.sel::after{content:"▾";margin-left:auto;color:var(--fg-subtle);font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--fg-muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.popover{position:absolute;top:56px;left:0;z-index:20;width:440px;display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px}
.popover .pre{display:flex;flex-direction:column;gap:2px}
.popover .pre span{padding:5px 10px;border-radius:8px;font-size:13px;color:var(--fg-muted)}
.popover .pre span.on{background:var(--primary-50);color:var(--primary-700);font-weight:600}
.cal{font-size:12px;color:var(--fg-muted)}
.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:6px}
.cal .days span{padding:3px 0;border-radius:6px}
.cal .days .in{background:var(--primary-50);color:var(--primary-700)}
.cal .days .edge{background:var(--primary);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 16px 0;font-size:12px;color:var(--fg-muted)}
.legend button{border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0;color:var(--fg-muted)}
.legend button.off{opacity:.4;text-decoration:line-through}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.chart{position:relative;padding:4px 8px 8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px 10px;font-size:12px;min-width:160px;display:none;z-index:5}
.tip .h{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:6px;color:var(--fg-muted)}
.tip .r b{margin-left:auto;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.tip .t{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.axis text{fill:var(--fg-subtle);font-size:10px}
.gridl{stroke:var(--line-soft)}
.dist{display:grid;grid-template-columns:168px 1fr;gap:12px;align-items:center;padding:8px 16px 16px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;color:var(--fg-subtle);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.muted{color:var(--fg-subtle)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px}
.tabs span{padding:10px 12px;font-size:13px;color:var(--fg-muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs svg,.dh svg{width:16px;height:16px;flex:none}
.tabs span.on{color:var(--primary-700);border-color:var(--primary);font-weight:600}
.tabs .cnt{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--fg-muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;background:var(--surface-2)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500}
.b-ok{background:var(--tint-success);color:var(--ink-success)}.b-bad{background:var(--tint-danger);color:var(--ink-danger)}
.b-info{background:var(--tint-info);color:var(--ink-info)}.b-gray{background:var(--surface-2);color:var(--fg-muted);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.rec{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.rec .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.rec .ic svg{width:18px;height:18px}
.rec .r{margin-left:auto;text-align:right}
.qa{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface-2)}
.qa .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.qa .ic svg{width:20px;height:20px}
.qa .chev{margin-left:auto;color:var(--fg-subtle)}
.qa small{display:block;color:var(--fg-subtle);font-size:12px}
.list{display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px}
.hb{display:grid;grid-template-columns:22px 150px 1fr 76px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.hb .bar{height:12px;border-radius:0 4px 4px 0;background:var(--s1)}
.hb .bar.o{background:var(--other)}
.rank{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--fg-muted)}
.r1{background:#fde68a;color:#92400e}.r2{background:#e2e8f0;color:#334155}.r3{background:#fed7aa;color:#9a3412}
.lat{display:flex;gap:6px;align-items:stretch}
.lat i{width:3px;border-radius:2px;background:linear-gradient(var(--ok) 45%,var(--warn) 55%)}
.lat div{font-size:11.5px;line-height:1.35}
.ann{border:1px dashed var(--primary);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--primary-700);background:var(--primary-50)}
.ann b{font-weight:600}
.drawer{position:fixed;right:0;top:44px;bottom:0;width:520px;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.12);z-index:30;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:16px;border-bottom:1px solid var(--line)}
.drawer .db{padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.scrim{position:fixed;inset:44px 0 0 0;background:rgba(15,23,42,.35);z-index:25}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--primary)}
.hide{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g32,.g2,.g3{grid-template-columns:1fr}.side{display:none}}
</style>
</head>

// ---------- chart engine (SVG, one y-axis per chart) ----------
const groups={};
function nice(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function xy(el,o){
 const W=o.w||640,H=o.h||220,L=46,R=10,T=10,B=24,iw=W-L-R,ih=H-T-B,n=o.labels.length;
 const st={hidden:new Set(),hover:-1};
 const box=document.getElementById(el);
 const legend=o.series.length>1?`<div class="legend">${o.series.map((s,i)=>`<button data-i="${i}"><span class="sw" style="background:var(${s.c})"></span>${s.name}</button>`).join('')}</div>`:'';
 box.innerHTML=legend+`<div class="chart"><svg viewBox="0 0 ${W} ${H}"></svg><div class="tip"></div></div>`;
 const svg=box.querySelector('svg'),tip=box.querySelector('.tip');
 const band=iw/n,xc=i=>o.kind==='area'||o.kind==='line'?L+(n===1?iw/2:i*iw/(n-1)):L+band*i+band/2;
 function draw(){
  const vis=o.series.filter((s,i)=>!st.hidden.has(i));
  const stacked=o.kind==='area'||o.kind==='sbar';
  const tot=o.labels.map((_,i)=>stacked?vis.reduce((a,s)=>a+s.v[i],0):Math.max(0,...vis.map(s=>s.v[i])));
  const ymax=o.max||nice(Math.max(...tot)*1.08);
  const y=v=>T+ih-(v/ymax)*ih;
  let g='';
  for(let k=0;k<=4;k++){const v=ymax*k/4,yy=y(v);g+=`<line class="gridl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${(o.yf||fmtK)(v)}</text>`}
  const every=Math.ceil(n/(o.w&&o.w<400?4:8));
  o.labels.forEach((l,i)=>{if((i%every===0&&n-1-i>=every/2)||i===n-1)g+=`<text x="${xc(i)}" y="${H-6}" text-anchor="middle">${l}</text>`});
  let m='';
  if(o.kind==='area'){
   const base=o.labels.map(()=>0);
   vis.forEach(s=>{const top=s.v.map((v,i)=>base[i]+v);
    const d='M'+top.map((v,i)=>`${xc(i)},${y(v)}`).join('L')+'L'+base.map((v,i)=>`${xc(i)},${y(v)}`).reverse().join('L')+'Z';
    m+=`<path d="${d}" style="fill:var(${s.c});fill-opacity:.88;stroke:var(--surface);stroke-width:1.5"/>`;
    top.forEach((v,i)=>base[i]=v)});
  }else if(o.kind==='line'){
   vis.forEach(s=>{m+=`<polyline points="${s.v.map((v,i)=>`${xc(i)},${y(v)}`).join(' ')}" style="fill:none;stroke:var(${s.c});stroke-width:2;stroke-linejoin:round"/>`});
  }else{
   const bw=Math.min(28,band*.62);
   o.labels.forEach((_,i)=>{let acc=0;vis.forEach((s,j)=>{const v=s.v[i];if(!v)return;const y1=y(acc+v),y0=y(acc),h=Math.max(1,y0-y1-(j>0?2:0));const top=j===vis.length-1;
     const x=xc(i)-bw/2,r=top?Math.min(4,h):0;
     m+=`<path d="M${x},${y0}V${y0-h+r}q0,-${r} ${r},-${r}H${x+bw-r}q${r},0 ${r},${r}V${y0}Z" style="fill:var(${s.c})"/>`;acc+=v})});
  }
  const hx=st.hover>=0?xc(st.hover):-99;
  let cross=`<line x1="${hx}" x2="${hx}" y1="${T}" y2="${T+ih}" style="stroke:var(--fg-subtle);stroke-dasharray:3 3;${st.hover<0?'display:none':''}"/>`;
  if(st.hover>=0&&(o.kind==='area'||o.kind==='line')){let acc=0;vis.forEach(s=>{acc=(o.kind==='area'?acc:0)+s.v[st.hover];cross+=`<circle cx="${hx}" cy="${y(acc)}" r="4" style="fill:var(${s.c});stroke:var(--surface);stroke-width:2"/>`})}
  svg.innerHTML=`<g class="axis">${g}</g>${m}${cross}<rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>`;
 }
 function idx(e){const r=svg.getBoundingClientRect();const mx=(e.clientX-r.left)*W/r.width-L;
  return Math.max(0,Math.min(n-1,o.kind==='area'||o.kind==='line'?Math.round(mx/(iw/(Math.max(1,n-1)))):Math.floor(mx/band)))}
 const api={set(i,show,e){st.hover=i;draw();
   if(!show||i<0){tip.style.display='none';return}
   const vis=o.series.filter((s,k)=>!st.hidden.has(k));
   const rows=vis.map(s=>`<div class="r"><span class="sw" style="background:var(${s.c})"></span>${s.name}<b>${(o.tf||o.yf||fmtK)(s.v[i])}</b></div>`).join('');
   const extra=o.foot?o.foot(i,vis):'';
   tip.innerHTML=`<div class="h">${(o.th||(l=>l))(o.labels[i])}</div>${rows}${extra}`;
   tip.style.display='block';
   const cr=box.querySelector('.chart').getBoundingClientRect(),r=svg.getBoundingClientRect();
   let left=(xc(i)*r.width/W)+(r.left-cr.left)+14;if(left+tip.offsetWidth>cr.width)left-=tip.offsetWidth+28;
   tip.style.left=left+'px';tip.style.top='18px';}};
 svg.addEventListener('mousemove',e=>{const i=idx(e);(groups[o.group]||[api]).forEach(c=>c.set(i,c===api))});
 svg.addEventListener('mouseleave',()=>{(groups[o.group]||[api]).forEach(c=>c.set(-1,false))});
 box.querySelectorAll('.legend button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;st.hidden.has(i)?st.hidden.delete(i):st.hidden.add(i);if(st.hidden.size===o.series.length)st.hidden.delete(i);b.classList.toggle('off',st.hidden.has(i));draw()});
 if(o.group)(groups[o.group]=groups[o.group]||[]).push(api);
 draw();return api;
}
function donut(el,items,metric){
 const tot=items.reduce((a,x)=>a+x[metric],0);let a0=-Math.PI/2;const R=70,r=46,cx=84,cy=84;let s='';
 items.forEach(x=>{const a1=a0+2*Math.PI*x[metric]/tot;const big=a1-a0>Math.PI?1:0;
  const p=(a,rr)=>`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;
  s+=`<path d="M${p(a0,R)}A${R},${R} 0 ${big} 1 ${p(a1,R)}L${p(a1,r)}A${r},${r} 0 ${big} 0 ${p(a0,r)}Z" style="fill:var(${x.c});stroke:var(--surface);stroke-width:2"><title>${x.k}：${metric==='cost'?fmt$(x.cost):fmtK(x.tok)+' tokens'}（${pct(x[metric]/tot)}）</title></path>`;a0=a1});
 const center=metric==='cost'?fmt$(tot):fmtK(tot);
 document.getElementById(el).innerHTML=`<svg viewBox="0 0 168 168" style="width:168px">${s}<text x="84" y="80" text-anchor="middle" style="fill:var(--fg-subtle);font-size:10px">${metric==='cost'?'费用':'Token'}</text><text x="84" y="98" text-anchor="middle" style="fill:var(--fg);font-size:15px;font-weight:700">${center}</text></svg>`;
}
function distTable(items,metric,firstCol){
 const tot=items.reduce((a,x)=>a+x[metric],0);
 return `<table><thead><tr><th>${firstCol}</th><th class="num">请求</th><th class="num">${metric==='cost'?'费用':'Token'}</th><th class="num">占比</th></tr></thead><tbody>${items.map(x=>`<tr><td><span class="sw" style="background:var(${x.c});margin-right:6px"></span>${x.k}</td><td class="num">${fmtN(x.req)}</td><td class="num">${metric==='cost'?fmt$(x.cost):fmtK(x.tok)}</td><td class="num muted">${pct(x[metric]/tot)}</td></tr>`).join('')}</tbody></table>`;
}
function distCard(id,title,items,firstCol,extraToggle=''){
 return `<div class="card"><div class="ch"><h3>${title}</h3><div class="r">${extraToggle}<div class="seg" data-dist="${id}"><button class="on" data-m="tok">Token</button><button data-m="cost">费用</button></div></div></div>
 <div class="dist"><div id="${id}"></div><div id="${id}-t" style="max-height:200px;overflow:auto">${distTable(items,'tok',firstCol)}</div></div></div>`;
}
function wireDist(id,items,firstCol){
 donut(id,items,'tok');
 document.querySelectorAll(`[data-dist="${id}"] button`).forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));donut(id,items,b.dataset.m);document.getElementById(id+'-t').innerHTML=distTable(items,b.dataset.m,firstCol)});
}
