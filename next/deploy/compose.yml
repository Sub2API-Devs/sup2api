# sub2api-next test environment (two nodes behind Caddy).
#
# On the test server (see deploy/README.md):
#   cd ~/sub2api-next-test/src/next/deploy
#   docker compose -p sub2api-next-test build && docker compose -p sub2api-next-test up -d
#
# Only Caddy publishes a port, and only on 127.0.0.1:3120. Everything else
# stays on the project network. Secrets come from deploy/.env (see .env.example).
name: sub2api-next-test

x-node: &node
  image: sub2api-next:test
  pull_policy: never
  restart: unless-stopped
  mem_limit: ${NODE_MEM_LIMIT:-1g}
  depends_on:
    pg: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &node-env
    SUB2API_HTTP_ADDR: ":8080"
    SUB2API_PUBLIC_URL: ${SUB2API_PUBLIC_URL:-http://127.0.0.1:3120}
    SUB2API_DATABASE_URL: postgres://sub2api:${PG_PASSWORD:?set PG_PASSWORD in .env}@pg:5432/sub2api?sslmode=disable
    SUB2API_REDIS_URL: redis://redis:6379/0
    SUB2API_LOG_LEVEL: ${SUB2API_LOG_LEVEL:-info}
    SUB2API_MASTER_KEY: ${SUB2API_MASTER_KEY:?set SUB2API_MASTER_KEY in .env}
    SUB2API_JWT_SECRET: ${SUB2API_JWT_SECRET:?set SUB2API_JWT_SECRET in .env}
    SUB2API_ACCESS_TOKEN_TTL: ${SUB2API_ACCESS_TOKEN_TTL:-2h}
    SUB2API_REFRESH_TOKEN_TTL: ${SUB2API_REFRESH_TOKEN_TTL:-720h}
    SUB2API_BOOTSTRAP_ADMIN_EMAIL: ${SUB2API_BOOTSTRAP_ADMIN_EMAIL:-admin@sub2api.test}
    SUB2API_BOOTSTRAP_ADMIN_PASSWORD: ${SUB2API_BOOTSTRAP_ADMIN_PASSWORD:?set SUB2API_BOOTSTRAP_ADMIN_PASSWORD in .env}
    # Plugins: production-like sandbox (no dev mode, signed packages only).
    SUB2API_PLUGIN_DIR: /var/lib/sub2api/plugins
    SUB2API_PLUGIN_DEV_MODE: "false"
    SUB2API_PLUGIN_ALLOW_UNSIGNED: "false"
    SUB2API_PLUGIN_STRICT_NETWORK: "true"
    SUB2API_PLUGIN_SECCOMP: "true"
    SUB2API_PLUGIN_DB_ROLE_ISOLATION: "true"
    SUB2API_PLUGIN_MAX_MEMORY_MB: ${SUB2API_PLUGIN_MAX_MEMORY_MB:-1024}
    SUB2API_PLUGIN_MAX_PACKAGE_BYTES: ${SUB2API_PLUGIN_MAX_PACKAGE_BYTES:-209715200}
    # Empty = derived by the entrypoint from the dev key baked into the image.
    SUB2API_PLUGIN_OFFICIAL_KEYS: ${SUB2API_PLUGIN_OFFICIAL_KEYS:-}
    SUB2API_MARKET_SOURCES: ${SUB2API_MARKET_SOURCES:-}
    SUB2API_DEV_MARKET_URL: http://caddy:3120/market/index.json
    # Test only: accounts point at http://mock-upstream:8080.
    SUB2API_GATEWAY_ALLOW_PRIVATE_UPSTREAM: "true"
    # Caddy runs on the project network: trust its X-Forwarded-For.
    SUB2API_TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16

services:
  pg:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 256m
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: sub2api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 256m
    # Real-time state only: no persistence, bounded memory.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  node-1:
    <<: *node
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${SUB2API_VERSION:-0.1.0-dev}
    hostname: node-1
    environment:
      <<: *node-env
      NODE_ID: node-1
    volumes:
      - node1-data:/var/lib/sub2api

  node-2:
    <<: *node
    hostname: node-2
    environment:
      <<: *node-env
      NODE_ID: node-2
    volumes:
      - node2-data:/var/lib/sub2api

  # Copies the signed market (index.json, .sig, *.s2plugin) out of the node
  # image into a volume that Caddy serves as /market/*. Re-runs on every `up`.
  market-init:
    image: sub2api-next:test
    pull_policy: never
    restart: "no"
    mem_limit: 256m
    user: "0:0"
    entrypoint: ["sh", "-c", "rm -rf /market/* && cp -a /opt/sub2api/market/. /market/ && chmod -R a+rX /market && ls -l /market"]
    volumes:
      - market:/market

  mock-upstream:
    build:
      context: ./mock-upstream
    image: sub2api-next-mock-upstream:test
    restart: unless-stopped
    mem_limit: 64m

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      market-init: { condition: service_completed_successfully }
      node-1: { condition: service_started }
      node-2: { condition: service_started }
      mock-upstream: { condition: service_started }
    ports:
      - "127.0.0.1:3120:3120"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - market:/srv/market:ro
      - caddy-data:/data

volumes:
  pgdata: {}
  node1-data: {}
  node2-data: {}
  market: {}
  caddy-data: {}
