# Dedicated, disposable E2E stack. Never use a production or testdb project name.
# Build first: docker compose --env-file .env build node-1 mock-upstream
# Start:       docker compose --env-file .env up -d --no-build --wait
name: ${E2E_PROJECT:-sub2api-next-e2e}

x-node: &node
  image: ${E2E_APP_IMAGE:-sup2api-e2e:local}
  pull_policy: never
  # Crash/takeover tests explicitly stop and restart nodes.
  restart: "no"
  stop_grace_period: 180s
  # AC14 deliberately allocates 1500 MiB to test the container OOM boundary.
  mem_limit: 1g
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    pg: { condition: service_healthy }
    redis: { condition: service_healthy }
    market-init: { condition: service_completed_successfully }
  networks:
    - e2e
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
    interval: 3s
    timeout: 5s
    start_period: 60s
    retries: 40
  environment: &node-env
    SUB2API_HTTP_ADDR: ":8080"
    SUB2API_PUBLIC_URL: ${E2E_PUBLIC_URL:-http://127.0.0.1:3120}
    SUB2API_DATABASE_URL: postgres://sub2api:${E2E_DB_PASSWORD:?set E2E_DB_PASSWORD in the E2E .env}@pg:5432/sub2api?sslmode=disable
    SUB2API_REDIS_URL: redis://redis:6379/0
    SUB2API_MASTER_KEY: ${E2E_MASTER_KEY:?set E2E_MASTER_KEY to base64 of 32 random bytes}
    SUB2API_JWT_SECRET: ${E2E_JWT_SECRET:?set E2E_JWT_SECRET to at least 32 random characters}
    SUB2API_BOOTSTRAP_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-admin@sub2api.test}
    SUB2API_BOOTSTRAP_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:?set E2E_ADMIN_PASSWORD in the E2E .env}
    SUB2API_LOG_LEVEL: ${E2E_LOG_LEVEL:-info}
    SUB2API_PLUGIN_DIR: /var/lib/sub2api/plugins
    SUB2API_PLUGIN_DEV_MODE: "false"
    SUB2API_PLUGIN_ALLOW_UNSIGNED: "false"
    SUB2API_PLUGIN_VERIFY_SIGNATURES: "true"
    SUB2API_PLUGIN_STRICT_NETWORK: "true"
    SUB2API_PLUGIN_SECCOMP: "true"
    SUB2API_PLUGIN_DB_ROLE_ISOLATION: "true"
    SUB2API_PLUGIN_MAX_MEMORY_MB: "1024"
    # Both nodes trust the signing key bundled in this exact application image.
    SUB2API_USE_DEV_KEYS: "true"
    SUB2API_DEV_MARKET_URL: http://caddy:3120/market/index.json
    # The mock upstream is on the private, isolated E2E network. This exception
    # does not disable plugin seccomp, strict networking or package signatures.
    SUB2API_GATEWAY_ALLOW_PRIVATE_UPSTREAM: "true"

services:
  pg:
    image: ${E2E_PG_IMAGE:-postgres:16}
    restart: "no"
    mem_limit: 1g
    shm_size: 256m
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_DB: sub2api
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?set E2E_DB_PASSWORD in the E2E .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    # Any Redis-protocol server; Valkey is the default (Redis 7+ works too).
    image: ${E2E_REDIS_IMAGE:-valkey/valkey:9}
    restart: "no"
    mem_limit: 256m
    # Flags only: both images' entrypoints prepend their own server binary.
    command: ["--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping 2>/dev/null || redis-cli ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  node-1:
    <<: *node
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${E2E_VERSION:-0.1.0-e2e}
    hostname: node-1
    environment:
      <<: *node-env
      NODE_ID: node-1
    volumes:
      - node1data:/var/lib/sub2api

  node-2:
    <<: *node
    hostname: node-2
    environment:
      <<: *node-env
      NODE_ID: node-2
    volumes:
      - node2data:/var/lib/sub2api

  mock-upstream:
    image: ${E2E_MOCK_IMAGE:-sup2api-e2e-mock:local}
    pull_policy: never
    build:
      context: ../mock-upstream
      dockerfile: Dockerfile
    restart: "no"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - e2e

  market-init:
    image: ${E2E_APP_IMAGE:-sup2api-e2e:local}
    pull_policy: never
    restart: "no"
    mem_limit: 128m
    user: "0:0"
    entrypoint:
      - sh
      - -ec
      - >-
        test -s /opt/sub2api/market/index.json.sig &&
        test -s /opt/sub2api/market/dev-official.pub &&
        cp -a /opt/sub2api/market/. /market/ &&
        chmod -R a+rX /market
    volumes:
      - market:/market
    networks:
      - e2e

  caddy:
    image: ${E2E_CADDY_IMAGE:-caddy:2}
    restart: "no"
    mem_limit: 128m
    ports:
      - "127.0.0.1:${E2E_PORT:-3120}:3120"
    depends_on:
      market-init: { condition: service_completed_successfully }
      mock-upstream: { condition: service_started }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - market:/srv/market:ro
    networks:
      # A regular bridge provides host port publishing on Docker engines that
      # cannot publish a container attached only to an internal network.
      - edge
      - e2e

  # One-shot destructive acceptance runner. Start through test.sh so the
  # project/container labels are checked before granting Docker access.
  runner:
    profiles: [test]
    image: ${E2E_GO_IMAGE:-golang:1.27}
    restart: "no"
    mem_limit: 4g
    working_dir: /src/next/e2e
    entrypoint: [go, test]
    command: ["-count=1", "-timeout=30m", "-v", "./..."]
    environment:
      E2E_PROJECT: ${E2E_PROJECT:-sub2api-next-e2e}
      E2E_BASE_URL: http://caddy:3120
      E2E_DOCKER_HOST: local
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-admin@sub2api.test}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:?set E2E_ADMIN_PASSWORD in the E2E .env}
      E2E_LONG: ${E2E_LONG:-1}
      GOWORK: "off"
      GOFLAGS: "-buildvcs=false -mod=readonly"
      GOCACHE: /go/cache
      GOPROXY: ${E2E_GOPROXY:-https://proxy.golang.org,direct}
    volumes:
      - ${E2E_SOURCE_ROOT:-../../..}:/src:ro
      - ${E2E_DOCKER_BIN:-/usr/bin/docker}:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - gomod:/go/pkg/mod
      - gocache:/go/cache
    networks:
      - edge

# Compose prefixes every volume/network with E2E_PROJECT. No external resource,
# host networking or database port. Only the explicit test runner gets Docker.
volumes:
  pgdata: {}
  node1data: {}
  node2data: {}
  market: {}
  gomod: {}
  gocache: {}

networks:
  # Only Caddy and the opt-in test runner join edge. Backends stay internal.
  edge: {}
  e2e:
    internal: true
