# Disposable validation only: set an explicit unique project name with -p.
# No published ports, production services, or production volumes.
services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: sub2api
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: /var/lib/postgresql/data
  redis:
    image: ${CACHE_IMAGE:-valkey/valkey:9-alpine}
    healthcheck:
      test: [CMD-SHELL, "valkey-cli ping 2>/dev/null || redis-cli ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  mock:
    image: ${COMPOSE_PROJECT_NAME}-mock:local
    build:
      context: ../mock-upstream
      args:
        GO_IMAGE: golang:1.27
  gotest:
    image: golang:1.27
    working_dir: /src/next
    command: [sleep, infinity]
    volumes:
      - ../../..:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://postgres:sub2api@pg:5432/postgres?sslmode=disable
      TEST_REDIS_URL: redis://redis:6379/0
      GOFLAGS: -buildvcs=false
    mem_limit: 8g
    depends_on:
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  gomod:
    external: true
    name: sub2api-next-ci_gomod
  gocache:
    external: true
    name: sub2api-next-ci_gocache
