# Gateway-managed cluster, ovh part (2026-10-27): primary node sup2api-1 + releases server.
# The other node is sup2api-ccp on clicodeplus (/root/sup2api-node). api.prophey.ai goes to
# clicodeplus Caddy, which prefers its local node and falls back to this node through the
# ovh Caddy site sup2api.15.204.107.38.sslip.io -> 127.0.0.1:3130. 7443 is the node-to-node
# HTTPS port. Database: Supabase; Redis: valkey.prophey.ai:6380 (TLS); both in .env.
name: sup2api-managed

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: 5

x-node: &node
  logging: *logging
  image: ${GATEWAY_IMAGE:-sup2api-gateway:local}
  pull_policy: never
  restart: unless-stopped
  # The gateway drains its core (HTTP, then plugins and pending usage) on stop.
  stop_grace_period: 180s
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks:
    - sup2api_default
  volumes:
    - ./certs/ca.crt:/etc/sub2api/tls/ca.crt:ro
  environment:
    SUB2API_PLUGIN_OFFICIAL_KEYS: ${PLUGIN_TRUST_KEY:?}
    SUB2API_BUILTIN_TRUST_KEY: ${PLUGIN_TRUST_KEY:?}
    SUB2API_MARKET_SOURCES: ${MARKET_SOURCES:?}
    SUB2API_PLUGIN_VERIFY_SIGNATURES: "false"
    DATABASE_URL: ${DATABASE_URL:?}
    SUB2API_PG_MAX_CONNS: "10"
    SUB2API_GATEWAY_POOL_MAX_CONNS: "4"
    REDIS_URL: ${REDIS_URL:?}
    SUB2API_MASTER_KEY: ${SUB2API_MASTER_KEY}
    SUB2API_JWT_SECRET: ${SUB2API_JWT_SECRET}
    SUB2API_BOOTSTRAP_ADMIN_EMAIL: ${SUB2API_BOOTSTRAP_ADMIN_EMAIL}
    SUB2API_BOOTSTRAP_ADMIN_PASSWORD: ${SUB2API_BOOTSTRAP_ADMIN_PASSWORD}
  entrypoint: [sub2api-shell]
  command: [serve, -config, /etc/sub2api/shell.json]

services:
  sup2api-1:
    <<: *node
    container_name: sup2api-1
    ports:
      - "127.0.0.1:3130:8080"
      - "0.0.0.0:7443:7443"
    extra_hosts:
      - "sup2api-ccp:64.186.225.70"
    volumes:
      - ./certs/sup2api-1:/etc/sub2api/tls:ro
      - ./config/sup2api-1.json:/etc/sub2api/shell.json:ro
      - sup2api-1-data:/var/lib/sub2api

  releases:
    logging: *logging
    image: caddy:2-alpine
    container_name: releases
    restart: unless-stopped
    networks:
      - sup2api_default
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/releases:/etc/caddy/tls:ro
      - ./publish:/var/www:ro
    command: [caddy, run, --config, /etc/caddy/Caddyfile]

volumes:
  sup2api-1-data:

networks:
  sup2api_default:
    external: true
