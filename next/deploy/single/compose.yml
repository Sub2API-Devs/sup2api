# sup2api: single-node deployment of sub2api-next.
#
# PostgreSQL, Redis and the signed plugin market stay on the project network;
# only the service is published, on ${SUP2API_BIND:-127.0.0.1}:${SUP2API_PORT:-3130}
# (SUP2API_BIND=0.0.0.0 exposes it directly). See README.md in this directory.
#
#   docker compose -p sup2api -f compose.yml --env-file ~/sup2api/.env up -d --build
name: sup2api

services:
  pg:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 256m
    environment:
      POSTGRES_USER: sup2api
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: sup2api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sup2api -d sup2api"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    # Any Redis-protocol server; Valkey is the default (Redis 7+ works too).
    image: ${CACHE_IMAGE:-valkey/valkey:9}
    restart: unless-stopped
    mem_limit: 256m
    # Real-time state only (nodes, slots, caches): PostgreSQL is the source of truth.
    # Flags only: both images' entrypoints prepend their own server binary.
    # requirepass: plugins can reach the project network, so the cache must
    # not accept unauthenticated clients. REDIS_PASSWORD is hex (no URL
    # escaping in the clients' redis://:PASSWORD@redis:6379/0 URLs). The
    # server replaces its process title, so the flag does not stay visible
    # in the host's process list.
    command: ["--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD (hex) in .env}", "--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (hex) in .env}
    healthcheck:
      # The CLIs read the password from the environment, not the command line.
      test: ["CMD-SHELL", "export REDISCLI_AUTH=\"$$REDIS_PASSWORD\" VALKEYCLI_AUTH=\"$$REDIS_PASSWORD\"; (valkey-cli ping 2>/dev/null || redis-cli ping) | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${SUP2API_VERSION:-0.1.0}
    image: sup2api:latest
    pull_policy: never
    restart: unless-stopped
    # HTTP drains first, then plugins and pending usage flush to PostgreSQL.
    stop_grace_period: 180s
    mem_limit: ${SUP2API_MEM_LIMIT:-2g}
    # Runs as UID 1000 (sub2api) and needs no capabilities or privilege gains.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    hostname: sup2api-1
    depends_on:
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }
      market-init: { condition: service_completed_successfully }
    ports:
      - "${SUP2API_BIND:-127.0.0.1}:${SUP2API_PORT:-3130}:8080"
    environment: &app-env
      NODE_ID: sup2api-1
      SUB2API_HTTP_ADDR: ":8080"
      SUB2API_PUBLIC_URL: ${SUP2API_PUBLIC_URL:-http://127.0.0.1:3130}
      SUB2API_DATABASE_URL: postgres://sup2api:${PG_PASSWORD}@pg:5432/sup2api?sslmode=disable
      SUB2API_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # The core reads DATABASE_URL / REDIS_URL (server/internal/config).
      DATABASE_URL: postgres://sup2api:${PG_PASSWORD}@pg:5432/sup2api?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SUB2API_LOG_LEVEL: ${SUP2API_LOG_LEVEL:-info}
      SUB2API_MASTER_KEY: ${SUB2API_MASTER_KEY:?set SUB2API_MASTER_KEY in .env}
      SUB2API_JWT_SECRET: ${SUB2API_JWT_SECRET:?set SUB2API_JWT_SECRET in .env}
      SUB2API_BOOTSTRAP_ADMIN_EMAIL: ${SUB2API_BOOTSTRAP_ADMIN_EMAIL:?set SUB2API_BOOTSTRAP_ADMIN_EMAIL in .env}
      SUB2API_BOOTSTRAP_ADMIN_PASSWORD: ${SUB2API_BOOTSTRAP_ADMIN_PASSWORD:?set SUB2API_BOOTSTRAP_ADMIN_PASSWORD in .env}
      SUB2API_PLUGIN_DIR: /var/lib/sub2api/plugins
      SUB2API_PLUGIN_DEV_MODE: "false"
      SUB2API_PLUGIN_ALLOW_UNSIGNED: "false"
      # Test stack: packages are rebuilt with fresh dev keys, so the signature
      # check is off by default (publisher and revocation checks still apply).
      SUB2API_PLUGIN_VERIFY_SIGNATURES: ${SUB2API_PLUGIN_VERIFY_SIGNATURES:-false}
      SUB2API_PLUGIN_STRICT_NETWORK: "true"
      SUB2API_PLUGIN_SECCOMP: "true"
      SUB2API_PLUGIN_DB_ROLE_ISOLATION: "true"
      SUB2API_PLUGIN_MAX_MEMORY_MB: ${SUB2API_PLUGIN_MAX_MEMORY_MB:-1024}
      # Empty = trust the signing key generated at image build time and use
      # the bundled market below.
      SUB2API_PLUGIN_OFFICIAL_KEYS: ${SUB2API_PLUGIN_OFFICIAL_KEYS:-}
      SUB2API_MARKET_SOURCES: ${SUB2API_MARKET_SOURCES:-}
      SUB2API_DEV_MARKET_URL: http://market:8080/index.json
    volumes:
      - appdata:/var/lib/sub2api

  # Second node on the same PostgreSQL/Redis for multi-node testing.
  app-2:
    image: sup2api:latest
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 180s
    mem_limit: ${SUP2API_MEM_LIMIT:-2g}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    hostname: sup2api-2
    depends_on:
      app: { condition: service_started }
    ports:
      - "${SUP2API_BIND:-127.0.0.1}:${SUP2API_PORT_2:-3131}:8080"
    environment:
      <<: *app-env
      NODE_ID: sup2api-2
      SUB2API_PUBLIC_URL: ${SUP2API_PUBLIC_URL_2:-http://127.0.0.1:3131}
    volumes:
      - appdata2:/var/lib/sub2api

  # Copies the signed plugin market bundled in the image into a volume.
  market-init:
    image: sup2api:latest
    pull_policy: never
    restart: "no"
    mem_limit: 256m
    user: "0:0"
    entrypoint: ["sh", "-c", "rm -rf /market/* && cp -a /opt/sub2api/market/. /market/ && chmod -R a+rX /market"]
    volumes:
      - market:/market

  # Serves the market inside the project network only (http://market:8080/).
  market:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 64m
    command: ["caddy", "file-server", "--root", "/srv/market", "--listen", ":8080"]
    depends_on:
      market-init: { condition: service_completed_successfully }
    volumes:
      - market:/srv/market:ro

volumes:
  pgdata: {}
  appdata: {}
  appdata2: {}
  market: {}
