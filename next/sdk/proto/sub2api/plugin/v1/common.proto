syntax = "proto3";

package sub2api.plugin.v1;

option go_package = "github.com/Sub2API-Devs/sup2api/next/sdk/gen/pluginv1;pluginv1";

// Contract rules (keep the contract usable by a future JS runtime):
//  - every RPC except EgressService.Dial is unary;
//  - no google.protobuf.Any;
//  - free-form JSON travels as a string field whose name ends in `_json`;
//  - request bodies are never shipped whole on the gateway hot path: plugins
//    declare the fields they need and answer with BodyPatch instructions.

// BodyPatch is a single JSON edit the host applies to a request body (sjson).
message BodyPatch {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_SET = 1;
    OP_DELETE = 2;
  }
  Op op = 1;
  // gjson/sjson path, e.g. "model" or "metadata.user_id".
  string path = 2;
  // JSON-encoded value for OP_SET, e.g. "\"claude-x\"" or "1024".
  string value_json = 3;
}

// Account is what a platform plugin sees of one core account row.
message Account {
  int64 id = 1;
  string name = 2;
  string platform = 3;         // platform of the client endpoint serving this request
  string type = 4;             // account type id, declared by the called plugin
  // Decrypted credentials, only present when the plugin holds the
  // accounts.credentials grant (its own account types).
  string credentials_json = 5;
  // Non-sensitive settings (base_url, model_mapping ...).
  string settings_json = 6;
  AccountProperties properties = 7;
}

message AccountProperties {
  string status = 1;
  bool schedulable = 2;
  bool auto_disable = 3;
  int32 priority = 4;
  int32 weight = 5;
  int32 max_concurrency = 6;
  int32 rpm_limit = 7;
  int64 tpm_limit = 8;
  optional int64 proxy_id = 9;
  repeated string models = 10;
  map<string, string> model_mapping = 11;
  // Explicit automatic/manual model configuration; absent uses the plugin default.
  optional bool auto_models = 12;
}

message AccountLifecycleRequest {
  string phase = 1;
  Account account = 2;
  Caller caller = 3;
  string preparation_key = 4;
  string action = 5;
  repeated string changed_fields = 6;
  // Facts the core learned from the account's preparation, as a JSON object;
  // on before_create or before_update (saved account facts), "" when unknown. Known keys:
  // "subscription_type" (e.g. "max", "pro") and "account_email" (the
  // upstream login's email), each absent when unknown.
  string resource_facts_json = 7;
}

message AccountLifecycleResponse {
  repeated FieldError errors = 1;
  string settings_json = 2;
  bool run_resource = 3;
  // before_create / before_update: changes the plugin makes before saving;
  // ignored in other phases. The core validates them like the
  // caller's own input.
  AccountPatch account_patch = 4;
}

// AccountPatch replaces account fields; an absent field is left unchanged.
message AccountPatch {
  ModelList models = 1;
  ModelMappingValue model_mapping = 2;
  // Values of the account type's read-only extensions (extensionsSchema
  // properties with "readOnly": true), as a JSON object: the plugin's own
  // facts about the account, which the admin cannot edit. Only the keys given
  // change; a null value removes one. "" leaves them unchanged.
  string extensions_json = 3;
}

// ModelList is a model id list; empty means every model.
message ModelList {
  repeated string ids = 1;
}

// ModelMappingValue is a client model -> upstream model mapping.
message ModelMappingValue {
  map<string, string> entries = 1;
}

// Caller identifies the console user on whose behalf the host calls a plugin.
message Caller {
  int64 user_id = 1;
  string request_id = 2;
  string client_ip = 3;
  string locale = 4;
}

// RequestMeta describes one gateway request.
message RequestMeta {
  string request_id = 1;
  // Protocol the upstream request must speak, e.g. "anthropic.messages".
  // Differs from client_protocol when the core converts the request.
  string protocol = 2;
  string model = 3;
  bool stream = 4;
  int64 user_id = 5;
  int64 api_key_id = 6;
  int64 group_id = 7;
  string client_ip = 8;
  // Protocol of the client-facing endpoint (ARCHITECTURE 6.6).
  string client_protocol = 9;
  // Path parameters of the matched endpoint pattern, e.g. "model" for
  // /v1beta/models/:model:generateContent. Empty when the pattern has none.
  // At most 32 entries (lowest keys by name when more), keys cut to 64 bytes
  // and values to 512 bytes on a UTF-8 boundary.
  map<string, string> path_params = 10;
  // Query parameters the endpoint declared in request.queryParams, and only
  // those - the same "the plugin states what it needs and the host hands over
  // nothing else" rule request.requestFields follows. The endpoint's
  // auth.query parameter is always excluded (case-insensitively) because it
  // carries the API key, and the host never ships the whole query string:
  // that would leak credentials in parameters nobody declared.
  //
  // Names are matched case-insensitively, so a declared "alt" also picks up
  // "?Alt=sse"; the key is the name as the client sent it. Only the first
  // value of a repeated parameter is passed. Empty when the endpoint declared
  // none. Bounded exactly like path_params: at most 32 entries (lowest keys
  // by name when more), keys cut to 64 bytes and values to 512 bytes on a
  // UTF-8 boundary, invalid UTF-8 dropped.
  map<string, string> query = 11;
}

// FieldError reports a validation problem on one input field.
message FieldError {
  string field = 1;          // JSON path within the submitted object
  string code = 2;           // machine readable, e.g. "required", "pattern"
  string message = 3;        // human readable, localized by the plugin if possible
}

// UsageTokens are the token counts of one upstream response, in exactly the
// shape the declarative usage rules produce (manifest usage.json / usage.sse
// keys). The host normalises and prices them; a plugin states what the
// upstream reported and never what it costs.
//
// cache_creation_tokens is the TOTAL cache write, including the 1 hour part:
// the host subtracts cache_creation_1h_tokens from it, exactly as it does for
// the declarative rules, so both sources mean the same thing. A negative
// value counts as 0.
message UsageTokens {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_tokens = 3;
  int64 cache_creation_tokens = 4;
  int64 cache_creation_1h_tokens = 5;
}
