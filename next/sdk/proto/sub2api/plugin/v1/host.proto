syntax = "proto3";

package sub2api.plugin.v1;

option go_package = "github.com/Sub2API-Devs/sup2api/next/sdk/gen/pluginv1;pluginv1";

// HostService is served by the host to one plugin instance over the
// go-plugin broker. The host knows which plugin is calling from the broker
// connection and checks the matching grant on every call; calls without a
// grant fail with PERMISSION_DENIED.
service HostService {
  // log (always granted)
  rpc Log(LogRequest) returns (LogResponse);

  // kv (grant "kv"): Redis-backed, namespaced per plugin.
  rpc KVGet(KVGetRequest) returns (KVGetResponse);
  rpc KVSet(KVSetRequest) returns (KVSetResponse);
  rpc KVDelete(KVDeleteRequest) returns (KVDeleteResponse);
  rpc KVList(KVListRequest) returns (KVListResponse);

  // db.schema: restricted DSN for the plugin schema. The connection must go
  // through EgressService (the SDK dialer does this automatically).
  rpc GetDSN(GetDSNRequest) returns (GetDSNResponse);

  // authz (always granted): does a console user hold a permission?
  rpc AuthzCheck(AuthzCheckRequest) returns (AuthzCheckResponse);

  // ledger.credit / ledger.debit: bounded by the approved scope
  // (maxPerTx, maxPerDay), idempotent on idempotency_key.
  rpc LedgerCredit(LedgerChangeRequest) returns (LedgerChangeResponse);
  rpc LedgerDebit(LedgerChangeRequest) returns (LedgerChangeResponse);

  // broadcast (grant "broadcast"): deliver a small message to this plugin's
  // instances on every other live node (AppService.OnBroadcast), best
  // effort, e.g. "rules changed, reload". Payload at most 64 KiB.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // ---------------------------------------------------------------- accounts
  //
  // The two calls below let a plugin read the accounts of ITS OWN account
  // types outside a gateway request - a plugin's own HTTP routes get only
  // Caller{user_id, request_id, client_ip, locale}, so without them a console
  // page that has to talk to the upstream with the account's own credentials
  // (the Volcengine Ark asset library signs its OpenAPI calls with the
  // account's AK/SK) cannot be built at all.
  //
  // They do not widen what a plugin may see: BuildUpstreamRequest already
  // hands it the decrypted credentials of exactly these accounts on every
  // single request. What they do change is WHEN it may look - with no traffic,
  // and for every account at once - so two limits are part of the contract and
  // not optional:
  //
  //   * only accounts whose account type this plugin declares are visible.
  //     Anything else is reported as NOT_FOUND, never PERMISSION_DENIED: a
  //     different code would tell the plugin that an account id it may not
  //     read exists.
  //   * every GetAccountCredentials call writes an audit_logs row before the
  //     credentials are returned. A failed audit write fails the call.

  // accounts.read (Medium): metadata of the accounts of this plugin's account
  // types. The response carries no credential field of any kind; it is the
  // list a plugin needs to offer "pick an account" in its own console page.
  // Paginated: at most 200 rows per call (100 by default).
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // accounts.credentials {"types":"own"} (Critical): the decrypted credentials
  // of ONE account of this plugin's account types. Audited on every call.
  rpc GetAccountCredentials(GetAccountCredentialsRequest) returns (GetAccountCredentialsResponse);
}

message ListAccountsRequest {
  // Restrict to one account type id declared by this plugin; "" = all of them.
  // An unknown type simply matches nothing (it names no account the plugin
  // could see anyway).
  string type = 1;
  // Keyset cursor: "" starts at the lowest account id, otherwise pass the
  // next_cursor of the previous response. Rows are ordered by id.
  string cursor = 2;
  // Page size, 1..200; 0 or out of range uses 100.
  int32 limit = 3;
  // Include accounts whose status is not "active" (disabled, error) and
  // accounts taken out of scheduling. Default: only active, schedulable ones.
  bool include_inactive = 4;
}

message ListAccountsResponse {
  repeated AccountSummary accounts = 1;
  // Cursor of the next page; "" when this was the last one.
  string next_cursor = 2;
}

// AccountSummary is account metadata WITHOUT credentials. Deliberately no
// credentials field exists on this message: ListAccounts is authorised by
// accounts.read, which is not a credential grant.
message AccountSummary {
  int64 id = 1;
  string name = 2;
  // Account type id, always one this plugin declares.
  string type = 3;
  string status = 4;         // active | disabled | error
  // Whether the account takes gateway traffic (accounts.schedulable).
  bool enabled = 5;
  // Non-sensitive settings, the account type's settingsFields (base_url ...).
  // These are stored in plain JSONB and are the same values the plugin is
  // given as Account.settings_json on the gateway path.
  string settings_json = 6;
}

message GetAccountCredentialsRequest {
  int64 account_id = 1;
}

message GetAccountCredentialsResponse {
  AccountSummary account = 1;
  // Decrypted credentials (the non-settings part), the same JSON the plugin
  // receives as Account.credentials_json in BuildUpstreamRequest.
  string credentials_json = 2;
}

message PublishRequest {
  string topic = 1;                    // ^[a-z0-9_.-]{1,64}$
  bytes payload = 2;
}

message PublishResponse {}

message LogRequest {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_DEBUG = 1;
    LEVEL_INFO = 2;
    LEVEL_WARN = 3;
    LEVEL_ERROR = 4;
  }
  Level level = 1;
  string message = 2;
  map<string, string> attrs = 3;
}

message LogResponse {}

message KVGetRequest {
  string namespace = 1;
  string key = 2;
}

message KVGetResponse {
  bool found = 1;
  bytes value = 2;
}

message KVSetRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;           // <= 64 KiB
  int64 ttl_seconds = 4;     // 0 = no expiry
}

message KVSetResponse {}

message KVDeleteRequest {
  string namespace = 1;
  string key = 2;
}

message KVDeleteResponse {}

message KVListRequest {
  string namespace = 1;
  string prefix = 2;
  string cursor = 3;
  int32 limit = 4;           // <= 500
}

message KVListResponse {
  repeated string keys = 1;
  string next_cursor = 2;
}

message GetDSNRequest {}

message GetDSNResponse {
  // postgres:// DSN with the restricted plg_<key> role (or the host role
  // with search_path pinned when role isolation is unavailable).
  string dsn = 1;
  string schema = 2;
  bool role_isolated = 3;
}

message AuthzCheckRequest {
  int64 user_id = 1;
  // Plugin-local key ("rules:manage") or fully qualified key.
  string permission = 2;
}

message AuthzCheckResponse {
  bool allowed = 1;
}

message LedgerChangeRequest {
  int64 user_id = 1;
  string amount = 2;         // positive decimal string, USD, <= 8 decimals
  string idempotency_key = 3;
  string ref_type = 4;
  string ref_id = 5;
  string note = 6;
}

message LedgerChangeResponse {
  int64 ledger_id = 1;
  string balance_after = 2;
  bool duplicate = 3;        // idempotency key already applied
}

// EgressService is the only way a plugin reaches the network in strict mode.
// One bidirectional stream per connection:
//   plugin -> host : open, then data..., then close
//   host -> plugin : result, then data..., then close
service EgressService {
  rpc Dial(stream EgressFrame) returns (stream EgressFrame);
}

message EgressFrame {
  oneof kind {
    DialOpen open = 1;
    DialResult result = 2;
    bytes data = 3;          // <= 32 KiB per frame
    DialClose close = 4;
  }
}

message DialOpen {
  string network = 1;        // "tcp" (udp is not supported)
  string address = 2;        // "host:port"; host is resolved by the host
}

message DialResult {
  bool ok = 1;
  string error = 2;
  string remote_addr = 3;
}

message DialClose {
  string error = 1;          // empty = clean close
}
