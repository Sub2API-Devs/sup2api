syntax = "proto3";

package sub2api.plugin.v1;

option go_package = "github.com/Sub2API-Devs/sup2api/next/sdk/gen/pluginv1;pluginv1";

import "sub2api/plugin/v1/platform.proto";

// HostService is served by the host to one plugin instance over the
// go-plugin broker. The host knows which plugin is calling from the broker
// connection and checks the matching grant on every call. ExecuteHTTP instead
// requires the invocation-local authority issued by the host for Poll.
// Calls without the required authority fail with PERMISSION_DENIED.
service HostService {
  // These callbacks are authorized only by an active Execute/Monitor scope,
  // bound to the calling process, selected account and immutable attribution.
  // No monetary amount, user identity or account selector is accepted.
  rpc ForwardUpstream(ForwardUpstreamRequest) returns (ForwardUpstreamResponse);
  rpc RecordUsage(RecordUsageRequest) returns (ExecutionReceipt);
  // Submission usage, optional precharge and the durable polling registration
  // commit together. Success must precede publishing the submission response.
  rpc ReserveAndWatch(ReserveAndWatchRequest) returns (ExecutionReceipt);
  // Atomically persists progress; terminal reports settle/refund and close
  // monitoring in the same transaction. Repeating the same report is safe.
  rpc ReportTaskProgress(ReportTaskProgressRequest) returns (ExecutionReceipt);
  // log (always granted)
  rpc Log(LogRequest) returns (LogResponse);

  // kv (grant "kv"): Redis-backed, namespaced per plugin.
  rpc KVGet(KVGetRequest) returns (KVGetResponse);
  rpc KVSet(KVSetRequest) returns (KVSetResponse);
  rpc KVDelete(KVDeleteRequest) returns (KVDeleteResponse);
  rpc KVList(KVListRequest) returns (KVListResponse);

  // db.schema: restricted DSN for the plugin schema. The connection must go
  // through EgressService (the SDK dialer does this automatically).
  rpc GetDSN(GetDSNRequest) returns (GetDSNResponse);

  // authz (always granted): does a console user hold a permission?
  rpc AuthzCheck(AuthzCheckRequest) returns (AuthzCheckResponse);

  // ledger.credit / ledger.debit: bounded by the approved scope
  // (maxPerTx, maxPerDay), idempotent on idempotency_key.
  rpc LedgerCredit(LedgerChangeRequest) returns (LedgerChangeResponse);
  rpc LedgerDebit(LedgerChangeRequest) returns (LedgerChangeResponse);

  // broadcast (grant "broadcast"): deliver a small message to this plugin's
  // instances on every other live node (AppService.OnBroadcast), best
  // effort, e.g. "rules changed, reload". Payload at most 64 KiB.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // lock (grant "lock"): short cross-node mutual exclusion on the host's
  // Redis, for work that must not run on two nodes at once. Periodic work
  // belongs in manifest jobs[] instead (each trigger runs once cluster-wide).
  //
  //   * The host prefixes every name: the Redis key is
  //     lock:plugin:{plugin_key}:{name}, so plugins never see each other's
  //     locks. name must match ^[A-Za-z0-9._:/-]{1,128}$ and ttl_ms must be
  //     1000..300000, otherwise INVALID_ARGUMENT.
  //   * Validity is reported as a DURATION (valid_ms), counted by the host on
  //     its own clock from when it took or extended the lock, minus a drift
  //     margin - never as an absolute time, so plugin and host clocks do not
  //     have to agree. The plugin should count it from BEFORE it sent the
  //     request.
  //   * The locks are NOT fenced: a holder that stalls past its validity may
  //     find another node has taken the lock meanwhile, so the guarded work
  //     must still be idempotent.
  //   * The PLUGIN chooses the owner token: a fresh random value for every
  //     LockAcquire (at least 16 random bytes, e.g. from a CSPRNG, encoded
  //     as URL-safe base64 or hex), matching ^[A-Za-z0-9_-]{16,128}$. The
  //     host stores it as the lock's value in Redis. Because the plugin
  //     knows the token before it asks, a LockAcquire whose outcome is
  //     unknown (UNAVAILABLE, a deadline, a broken connection) can be undone
  //     with LockRelease(name, token) instead of blocking every other node
  //     until the ttl runs out.
  //   * Never reuse a token: a LockAcquire with the token of a lock this
  //     plugin ALREADY holds under that name fails the SET NX, and the
  //     cleanup of the failed attempt (a compare-and-delete with the same
  //     token) then deletes the held lock. The call answers acquired=false
  //     and nobody holds the lock afterwards.
  //   * The host keeps no state per lock: when the plugin process dies its
  //     locks lapse after their ttl.
  //   * Errors: no "lock" grant -> PERMISSION_DENIED; bad name, ttl or token
  //     -> INVALID_ARGUMENT; Redis unavailable or outcome unknown ->
  //     UNAVAILABLE (the lock may or may not be held - treat it as not held;
  //     after a LockAcquire, call LockRelease with the same token).
  //
  // LockAcquire makes ONE attempt, without waiting. acquired=false means
  // another holder has it; that is not an error.
  rpc LockAcquire(LockAcquireRequest) returns (LockAcquireResponse);
  // LockRenew extends a lock still held with token to ttl_ms from now.
  // held=false means the lock is definitely lost (expired, or held by
  // someone else); it is not an error.
  rpc LockRenew(LockRenewRequest) returns (LockRenewResponse);
  // LockRelease releases the lock only if it is still held with token.
  // Idempotent: releasing a lock that expired, was already released or was
  // never taken is not an error. UNAVAILABLE means the host could not tell
  // whether it was released; it then lapses after its ttl (or retry).
  rpc LockRelease(LockReleaseRequest) returns (LockReleaseResponse);

  // ---------------------------------------------------------------- accounts
  //
  // The two calls below let a plugin read the accounts of ITS OWN account
  // types outside a gateway request - a plugin's own HTTP routes get only
  // Caller{user_id, request_id, client_ip, locale}, so without them a console
  // page that has to talk to the upstream with the account's own credentials
  // (the Volcengine Ark asset library signs its OpenAPI calls with the
  // account's AK/SK) cannot be built at all.
  //
  // They do not widen what a plugin may see: BuildUpstreamRequest already
  // hands it the decrypted credentials of exactly these accounts on every
  // single request. What they do change is WHEN it may look - with no traffic,
  // and for every account at once - so two limits are part of the contract and
  // not optional:
  //
  //   * only accounts whose account type this plugin declares are visible.
  //     Anything else is reported as NOT_FOUND, never PERMISSION_DENIED: a
  //     different code would tell the plugin that an account id it may not
  //     read exists.
  //   * every GetAccountCredentials call writes an audit_logs row before the
  //     credentials are returned. A failed audit write fails the call.

  // accounts.read (Medium): metadata of the accounts of this plugin's account
  // types. The response carries no credential field of any kind; it is the
  // list a plugin needs to offer "pick an account" in its own console page.
  // Paginated: at most 200 rows per call (100 by default).
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // accounts.credentials {"types":"own"} (Critical): the decrypted credentials
  // of ONE account of this plugin's account types. Audited on every call.
  rpc GetAccountCredentials(GetAccountCredentialsRequest) returns (GetAccountCredentialsResponse);

  // One bounded HTTP observation on behalf of an active Poll invocation.
  // Authority comes from an opaque token bound to this exact plugin process,
  // account and invocation, not from a generic net/accounts permission.
  // The host enforces cancellation, the account proxy, limits and SSRF checks.
  // A token permits at most one HTTP request; redirects are not followed.
  rpc ExecuteHTTP(ExecutionHTTPRequest) returns (ExecutionHTTPResponse);
}

message ForwardUpstreamRequest {
  string execution_token = 1;
  BuildUpstreamRequestResponse request = 2;
}

message ForwardUpstreamResponse {
  // Bounded usage observation, never the entire request or an unbounded stream.
  ExtractUsageRequest observation = 1;
  bool extract_usage = 2;
  bool task_submission = 3;
  // The plugin classifies this locally and returns it from Execute; the host
  // retains the corresponding bytes and decides retry/failover eligibility.
  ClassifyErrorRequest error = 4;
}

message RecordUsageRequest {
  string execution_token = 1;
  // Absent: acknowledge host-collected declarative usage, including fallback
  // when plugin extraction failed. The host records that fallback explicitly.
  UsageReport report = 2;
}

message ReserveAndWatchRequest {
  string execution_token = 1;
  TaskSubmission task = 2;
}

message ReportTaskProgressRequest {
  string execution_token = 1;
  ReconcileResult result = 2;
}

message ExecutionReceipt {
  string task_id = 1;
}

message ExecutionHTTPRequest {
  string execution_token = 1;
  string method = 2;
  string url = 3;
  map<string, string> headers = 4;
  bytes body = 5;
}

message ExecutionHTTPResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
  string transport_error = 4;
  // Truncated or incomplete responses must never confirm a terminal state.
  bool truncated = 5;
}

message ListAccountsRequest {
  // Restrict to one account type id declared by this plugin; "" = all of them.
  // An unknown type simply matches nothing (it names no account the plugin
  // could see anyway).
  string type = 1;
  // Keyset cursor: "" starts at the lowest account id, otherwise pass the
  // next_cursor of the previous response. Rows are ordered by id.
  string cursor = 2;
  // Page size, 1..200; 0 or out of range uses 100.
  int32 limit = 3;
  // Include accounts whose status is not "active" (disabled, error) and
  // accounts taken out of scheduling. Default: only active, schedulable ones.
  bool include_inactive = 4;
}

message ListAccountsResponse {
  repeated AccountSummary accounts = 1;
  // Cursor of the next page; "" when this was the last one.
  string next_cursor = 2;
}

// AccountSummary is account metadata WITHOUT credentials. Deliberately no
// credentials field exists on this message: ListAccounts is authorised by
// accounts.read, which is not a credential grant.
message AccountSummary {
  int64 id = 1;
  string name = 2;
  // Account type id, always one this plugin declares.
  string type = 3;
  string status = 4;         // active | disabled | error
  // Whether the account takes gateway traffic (accounts.schedulable).
  bool enabled = 5;
  // Non-sensitive settings, the account type's settingsFields (base_url ...).
  // These are stored in plain JSONB and are the same values the plugin is
  // given as Account.settings_json on the gateway path.
  string settings_json = 6;
}

message GetAccountCredentialsRequest {
  int64 account_id = 1;
}

message GetAccountCredentialsResponse {
  AccountSummary account = 1;
  // Decrypted credentials (the non-settings part), the same JSON the plugin
  // receives as Account.credentials_json in BuildUpstreamRequest.
  string credentials_json = 2;
}

message PublishRequest {
  string topic = 1;                    // ^[a-z0-9_.-]{1,64}$
  bytes payload = 2;
}

message PublishResponse {}

message LockAcquireRequest {
  string name = 1;                     // ^[A-Za-z0-9._:/-]{1,128}$
  int64 ttl_ms = 2;                    // 1000..300000
  // Required. The owner token, chosen by the plugin: fresh random for every
  // call, ^[A-Za-z0-9_-]{16,128}$. Pass the same value to LockRenew and
  // LockRelease. See the notes on HostService.LockAcquire.
  string token = 3;
}

message LockAcquireResponse {
  // false = held by someone else (not an error); valid_ms unset.
  bool acquired = 1;
  // The token is the one sent in the request (the host used to generate it).
  reserved 2;
  reserved "token";
  // How long the lock stays valid, counted by the host from when it took
  // it, minus a drift margin.
  int64 valid_ms = 3;
}

message LockRenewRequest {
  string name = 1;
  string token = 2;                    // ^[A-Za-z0-9_-]{16,128}$
  int64 ttl_ms = 3;                    // 1000..300000
}

message LockRenewResponse {
  // false = definitely lost (expired, or held by someone else).
  bool held = 1;
  // Remaining validity after the renewal, as in LockAcquireResponse.
  int64 valid_ms = 2;
}

message LockReleaseRequest {
  string name = 1;
  string token = 2;                    // ^[A-Za-z0-9_-]{16,128}$
}

message LockReleaseResponse {}

message LogRequest {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_DEBUG = 1;
    LEVEL_INFO = 2;
    LEVEL_WARN = 3;
    LEVEL_ERROR = 4;
  }
  Level level = 1;
  string message = 2;
  map<string, string> attrs = 3;
}

message LogResponse {}

message KVGetRequest {
  string namespace = 1;
  string key = 2;
}

message KVGetResponse {
  bool found = 1;
  bytes value = 2;
}

message KVSetRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;           // <= 64 KiB
  int64 ttl_seconds = 4;     // 0 = no expiry
}

message KVSetResponse {}

message KVDeleteRequest {
  string namespace = 1;
  string key = 2;
}

message KVDeleteResponse {}

message KVListRequest {
  string namespace = 1;
  string prefix = 2;
  string cursor = 3;
  int32 limit = 4;           // <= 500
}

message KVListResponse {
  repeated string keys = 1;
  string next_cursor = 2;
}

message GetDSNRequest {}

message GetDSNResponse {
  // postgres:// DSN with the restricted plg_<key> role (or the host role
  // with search_path pinned when role isolation is unavailable).
  string dsn = 1;
  string schema = 2;
  bool role_isolated = 3;
}

message AuthzCheckRequest {
  int64 user_id = 1;
  // Plugin-local key ("rules:manage") or fully qualified key.
  string permission = 2;
}

message AuthzCheckResponse {
  bool allowed = 1;
}

message LedgerChangeRequest {
  int64 user_id = 1;
  string amount = 2;         // positive decimal string, USD, <= 8 decimals
  string idempotency_key = 3;
  string ref_type = 4;
  string ref_id = 5;
  string note = 6;
}

message LedgerChangeResponse {
  int64 ledger_id = 1;
  string balance_after = 2;
  bool duplicate = 3;        // idempotency key already applied
}

// EgressService is the only way a plugin reaches the network in strict mode.
// One bidirectional stream per connection:
//   plugin -> host : open, then data..., then close
//   host -> plugin : result, then data..., then close
service EgressService {
  rpc Dial(stream EgressFrame) returns (stream EgressFrame);
}

message EgressFrame {
  oneof kind {
    DialOpen open = 1;
    DialResult result = 2;
    bytes data = 3;          // <= 32 KiB per frame
    DialClose close = 4;
  }
}

message DialOpen {
  string network = 1;        // "tcp" (udp is not supported)
  string address = 2;        // "host:port"; host is resolved by the host
}

message DialResult {
  bool ok = 1;
  string error = 2;
  string remote_addr = 3;
}

message DialClose {
  string error = 1;          // empty = clean close
}
