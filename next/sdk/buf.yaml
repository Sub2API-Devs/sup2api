version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Some RPCs intentionally share messages (EgressFrame, LedgerChangeRequest,
    # GatewayRequestHookRequest) to keep the contract small.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
