# =============================================================================
# Sub2API 本地完整启动
# =============================================================================
# 一次性准备：
#   ../deploy/setup_nats_nsc.sh          # 生成 deploy/nats-auth/（compose 启动 NATS 必需）
#   cp .env.example .env && chmod 600 .env
#   ./build_all.sh                       # 只构建镜像，不启动
#   docker compose up -d                 # 启动 postgres/redis/nats/sub2api/ai-gateway
#
# 访问：
#   控制面  http://127.0.0.1:8080
#   数据面  http://127.0.0.1:9999
# =============================================================================

name: sup2api

services:
  sub2api:
    image: ${SUB2API_IMAGE:-sub2api:latest}
    container_name: sub2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    volumes:
      - sub2api_data:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - ENABLE_SERVER_TIMING=${ENABLE_SERVER_TIMING:-false}
      - RUN_MODE=${RUN_MODE:-standard}
      - UPDATE_GITHUB_TOKEN=${UPDATE_GITHUB_TOKEN:-}
      - ALIPAY_MOBILE_PRECREATE_DEEP_LINK=${ALIPAY_MOBILE_PRECREATE_DEEP_LINK:-}

      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-sub2api}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      - DATABASE_MAX_OPEN_CONNS=${DATABASE_MAX_OPEN_CONNS:-50}
      - DATABASE_MAX_IDLE_CONNS=${DATABASE_MAX_IDLE_CONNS:-10}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}

      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-1024}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS:-10}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}

      - USAGE_QUEUE_ENABLED=true
      - USAGE_QUEUE_URL=nats://nats:4222
      - USAGE_QUEUE_CREDENTIALS_FILE=/run/secrets/nats_control_credentials
      - USAGE_QUEUE_ISSUER_PROFILE_FILE=/run/secrets/nats_issuer_profile
      - USAGE_QUEUE_WORKER_URL=${NATS_WORKER_URL:-}
      - USAGE_QUEUE_STREAM=${NATS_USAGE_STREAM:-SUP2API_USAGE}
      - USAGE_QUEUE_SUBJECT=${NATS_USAGE_SUBJECT:-sup2api.usage.settlements.v1}
      - USAGE_QUEUE_DURABLE=${NATS_USAGE_DURABLE:-sup2api-usage-settlement-v1}
      - USAGE_QUEUE_MAX_AGE_HOURS=${NATS_USAGE_MAX_AGE_HOURS:-24}
      - USAGE_QUEUE_MAX_BYTES=${NATS_USAGE_MAX_BYTES:-1073741824}
      - USAGE_QUEUE_CONSUMERS=${NATS_USAGE_CONSUMERS:-8}
      - DATA_PLANE_CONTROL_ENABLED=true
      - DATA_PLANE_CONTROL_NETWORK=tcp
      - DATA_PLANE_CONTROL_ADDRESS=0.0.0.0:9090
      - DATA_PLANE_CONTROL_INSECURE=true
      - DATA_PLANE_CONTROL_GRANT_SECRET=${DATA_PLANE_CONTROL_GRANT_SECRET:?DATA_PLANE_CONTROL_GRANT_SECRET is required}
      - DATA_PLANE_CONTROL_GRANT_TTL_SECONDS=${DATA_PLANE_CONTROL_GRANT_TTL_SECONDS:-60}
      - DATA_PLANE_CONTROL_LEASE_TTL_SECONDS=${DATA_PLANE_CONTROL_LEASE_TTL_SECONDS:-60}

      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sub2api.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      - SETUP_MIGRATION_TIMEOUT_SECONDS=${SETUP_MIGRATION_TIMEOUT_SECONDS:-0}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      - TZ=${TZ:-Asia/Shanghai}

      - GEMINI_OAUTH_CLIENT_ID=${GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
      - GEMINI_OAUTH_SCOPES=${GEMINI_OAUTH_SCOPES:-}
      - GEMINI_QUOTA_POLICY=${GEMINI_QUOTA_POLICY:-}
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_USER_AGENT_VERSION=${ANTIGRAVITY_USER_AGENT_VERSION:-}

      - SECURITY_URL_ALLOWLIST_ENABLED=${SECURITY_URL_ALLOWLIST_ENABLED:-false}
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-true}
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-true}
      - SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS=${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}
      - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}

      - GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT=${GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT:-0}
      - GATEWAY_OPENAI_HTTP2_ENABLED=${GATEWAY_OPENAI_HTTP2_ENABLED:-true}
      - GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1=${GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1:-true}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD=${GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD:-2}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS:-60}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS:-600}
      - GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_FAILURE_THRESHOLD=${GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_FAILURE_THRESHOLD:-2}
      - GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_WINDOW_SECONDS=${GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_WINDOW_SECONDS:-60}
      - GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_TTL_SECONDS=${GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_TTL_SECONDS:-600}
      - GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT=${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      - GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL=${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      - GATEWAY_IMAGE_CONCURRENCY_ENABLED=${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      - GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE=${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      - GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS=${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    secrets:
      - nats_control_credentials
      - nats_issuer_profile
    networks:
      - sub2api-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: sub2api-postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    container_name: sub2api-redis
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - redis_data:/data
    command: >
      sh -c '
        redis-server \
        --save 60 1 \
        --appendonly yes \
        --appendfsync everysec \
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nats:
    image: ${NATS_IMAGE:-nats:2.11-alpine}
    container_name: sub2api-nats
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats-server.conf"]
    ports:
      - "${NATS_BIND_HOST:-127.0.0.1}:${NATS_PORT:-4222}:4222"
    environment:
      - NATS_MAX_CONNECTIONS=${NATS_MAX_CONNECTIONS:-10000}
      - NATS_MAX_PAYLOAD=${NATS_MAX_PAYLOAD:-8MB}
      - NATS_MAX_PENDING=${NATS_MAX_PENDING:-64MB}
      - NATS_JETSTREAM_MAX_MEMORY_STORE=${NATS_JETSTREAM_MAX_MEMORY_STORE:-512MB}
      - NATS_JETSTREAM_MAX_FILE_STORE=${NATS_JETSTREAM_MAX_FILE_STORE:-10GB}
      - NATS_JETSTREAM_SYNC_INTERVAL=${NATS_JETSTREAM_SYNC_INTERVAL:-30s}
    volumes:
      - nats_data:/data
      - ../deploy/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ${NATS_SERVER_AUTH_CONFIG:-../deploy/nats-auth/nats-server-auth.conf}:/etc/nats/nats-server-auth.conf:ro
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    stop_grace_period: 30s
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  sup2api-gateway:
    image: ${AI_GATEWAY_IMAGE:-sup2api/ai-gateway:local}
    container_name: sup2api-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_HOST:-127.0.0.1}:${AI_GATEWAY_PORT:-9999}:9999"
    volumes:
      - sup2api_gateway_data:/var/lib/ai-gateway/data
    environment:
      - AI_GATEWAY_LISTEN=:9999
      - AI_GATEWAY_PAIRING_TOKEN=${AI_GATEWAY_PAIRING_TOKEN:?AI_GATEWAY_PAIRING_TOKEN is required}
      - AI_GATEWAY_WORKER_CONFIG_PATH=/var/lib/ai-gateway/data/worker-config.json
      - AI_GATEWAY_WORKER_VAULT_PATH=/var/lib/ai-gateway/data/worker-vault.db
      - AI_GATEWAY_LEASE_RENEW_INTERVAL=${AI_GATEWAY_LEASE_RENEW_INTERVAL:-30s}
      - AI_GATEWAY_STARTUP_REQUIRED=true
      - AI_GATEWAY_SETTLEMENT_WAL_PATH=/var/lib/ai-gateway/data/settlements
      - AI_GATEWAY_SETTLEMENT_WAL_MAX_BYTES=${AI_GATEWAY_SETTLEMENT_WAL_MAX_BYTES:-1073741824}
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      sub2api:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:9999/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  sub2api_data:
  postgres_data:
  redis_data:
  nats_data:
  sup2api_gateway_data:

networks:
  sub2api-network:
    driver: bridge

secrets:
  nats_control_credentials:
    file: ${NATS_CONTROL_CREDENTIALS_FILE:-../deploy/nats-auth/control.creds}
  nats_issuer_profile:
    file: ${NATS_ISSUER_PROFILE_FILE:-../deploy/nats-auth/issuer-profile.json}
